name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check backend/

      - name: Format (ruff format --check)
        run: ruff format --check backend/

      - name: Security (bandit)
        run: bandit -r backend/src/ -c pyproject.toml

      - name: Type check (mypy)
        run: mypy backend/src/

      - name: Tests (pytest)
        env:
          COSMOS_DB_ENDPOINT: "https://localhost:8081"
          COSMOS_DB_KEY: "test-key"
          COSMOS_DB_DATABASE: "test-db"
        run: pytest backend/tests/ --cov=backend/src --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src/

      - name: Format (prettier --check)
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Tests (vitest)
        run: npx vitest run --coverage
