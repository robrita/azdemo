[project]
name = "function-cosmosdb"
version = "0.1.0"
description = "Azure Functions app with AI Search capabilities"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "aiohttp==3.13.2",
    "azure-functions==1.24.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "pillow==12.0.0",
    "PyMuPDF==1.26.6",
    "python-dotenv==1.2.1",
]

[project.optional-dependencies]
monitoring = [
    # Uncomment to enable Azure Monitor OpenTelemetry
    # Ref: aka.ms/functions-azure-monitor-python
    # "azure-monitor-opentelemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.ruff]
# Set the maximum line length to 100 characters
line-length = 100

# Target Python 3.10+
target-version = "py310"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function call in argument defaults
    "RET504", # Unnecessary assignment before return
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"
