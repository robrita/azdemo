[project]
name = "azdemo"
version = "0.1.0"
description = "PMO Agent Dashboard - Comprehensive Project Management Operations Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.50.0",
    "pandas==2.3.3",
    "plotly==6.3.1",
    "openai==2.3.0",
    "dotenv>=0.9.9",
    "azure-ai-projects>=1.0.0",
    "azure-identity>=1.25.1",
    "azure-cosmos>=4.9.0",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core>=1.35.1",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
