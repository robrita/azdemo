services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: template-cosmos
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 4
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: true
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      COSMOS_ENDPOINT: ${COSMOS_DOCKER_ENDPOINT:-https://cosmos:8081}
    ports:
      - "8000:8000"
    depends_on:
      cosmos:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./function_app.py:/app/function_app.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules